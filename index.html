<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/app.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="main-header-container">
            <h1 id="header">Where in the world?</h1>
            <div class="mode">
                <p><i class="fa-regular fa-moon"></i></p>
                <p>Dark Mode</p>
            </div>
        </div>
        <div class="search-region-select">
            <div class="search-container">
                <i class="fa-duotone fa-solid fa-magnifying-glass"></i>
                <input type="text" id="inputText" placeholder="Search for a country...">
            </div>
            <div class="select-option-container">
                <select name="region" id="region">
                    <option value="" disabled selected>Filter by Region</option>
                    <option value="africa"><p>Africa</p></option>
                    <option value="america"><p>America</p></option>
                    <option value="asia"><p>Asia</p></option>
                    <option value="europe"><p>Europe</p></option>
                    <option value="oceania"><p>Oceania</p></option>
                </select>
            </div>
        </div>

        <div class="products-container">
        </div>

    </div>
</body>

</html>
